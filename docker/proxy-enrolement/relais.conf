# Ce que tout relais transmet — et ce qu'il ne transmet pas.
proxy_ssl_server_name on;
proxy_ssl_name        API_HOTE;
proxy_ssl_verify      on;
# Le défaut de nginx est verify_depth 1 : la chaîne Let's Encrypt du plan
# machine (feuille ← YE1 ← Root YE ← ISRG X2 cross-signé X1) compte TROIS
# intermédiaires — sans cette ligne, « unable to get local issuer
# certificate » et 502 sur les deux routes (constaté le 16/08/2026 au
# premier POST /enroler réel, sur les deux passerelles).
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Host              API_HOTE;
proxy_set_header X-Forwarded-Proto https;
# L'IP source du kit remonte : l'app en a besoin pour la vue sécurité (§10)
# et pour les rafales d'enrôlements échoués (annexe 4 §5).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_http_version 1.1;
proxy_set_header Connection "";
